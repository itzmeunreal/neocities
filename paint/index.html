</head>
<body>
    <div class="content">
        <div class="navbar">
            <span class="nav-text">unreal's sketchbook</span>
            <div class="nav-dropdown">

                </button>
                <div class="dropdown-menu">
                    <a href="https://itzmeunreal.neocities.org/home.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/home.png" width="14" height="14" class="nav-icon">
                        home
                    </a>
                    <a href="https://itzmeunreal.neocities.org/about.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/about.png" width="14" height="14" class="nav-icon">
                        about
                    </a>
                    <a href="https://itzmeunreal.neocities.org/works.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/work.png" width="14" height="14" class="nav-icon">
                        works
                    </a>
                </div>
            </div>
            <div class="nav-dropdown">
                <button class="nav-button active" }>
                    <img src="https://itzmeunreal.neocities.org/images/joystick.png" width="16" height="16" class="nav-icon">
                    entertainment
                    <span class="dropdown-arrow">&#9662;</span>
                </button>
                <div class="dropdown-menu">
                    <a href="https://itzmeunreal.neocities.org/music.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/music.png" width="14" height="14" class="nav-icon">
                        music player
                    </a>
                    <a href="https://itzmeunreal.neocities.org/arcade.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/joystick.png" width="14" height="14" class="nav-icon">
                        arcade
                    </a>
                    <a href="https://itzmeunreal.neocities.org/paint.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/sketch.png" width="14" height="14" class="nav-icon">
                        sketchbook
                    </a>
                </div>
            </div>
            <div class="nav-dropdown">
                <button class="nav-button">
                    <img src="https://itzmeunreal.neocities.org/images/community1.png" width="16" height="16" class="nav-icon">
                    community
                    <span class="dropdown-arrow">&#9662;</span>
                </button>
                <div class="dropdown-menu">
                    <a href="https://itzmeunreal.neocities.org/forum.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/forum.png" width="14" height="14" class="nav-icon">
                        forum
                    </a>
                    <a href="https://itzmeunreal.neocities.org/chat.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/chat.png" width="14" height="14" class="nav-icon">
                        chat room
                    </a>
                    <a href="https://itzmeunreal.neocities.org/guestbook.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/guestbook.png" width="14" height="14" class="nav-icon">
                        guestbook
                    </a>
                </div>
            </div>
            <div class="nav-dropdown">
                <button class="nav-button">
                    <img src="https://itzmeunreal.neocities.org/images/extras.png" width="16" height="16" class="nav-icon">
                    extra
                    <span class="dropdown-arrow">&#9662;</span>
                </button>
                <div class="dropdown-menu">
                    <a href="https://itzmeunreal.neocities.org/siteinfo.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/thisweb.png" width="14" height="14" class="nav-icon">
                        site info
                    </a>
                    <a href="https://itzmeunreal.neocities.org/contributors.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/users.png" width="14" height="14" class="nav-icon">
                        contributors
                    </a>
                    <a href="https://itzmeunreal.neocities.org/donate.html" class="dropdown-item">
                        <img src="https://itzmeunreal.neocities.org/images/donate.png" width="14" height="14" class="nav-icon">
                        donate
                    </a>
                    <a href="https://gamesbefore.neocities.org/" class="dropdown-item">
                        <img src="https://gamesbefore.neocities.org/img/glungus.png" width="14" height="14" class="nav-icon">
                        GLUNGUS
                    </a>
                </div>
            </div>
        </div>
        <div class="main">
            <div class="card card-padded">
                <p class="section-title">sketchbook</p>
                <div class="iframe-wrapper">
                    <iframe src="https://jspaint.app" class="iframe" allowfullscreen></iframe>
                </div>
            </div>
            <div class="card card-padded">
                <p class="section-title">send me your drawing!</p>
                <p class="form-subtitle">save your creation and send it here :)</p>
                <form id="sketchForm" class="sketch-form">
                    <input type="text" name="fi-sender-fullName" placeholder="your name or alias" required class="sketch-input">
                    <input type="file" name="fi-file-drawing" accept="image/*" required class="sketch-input">
                    <textarea name="fi-text-message" placeholder="say something about your drawing! (optional)" rows="3" class="sketch-input"></textarea>
                    <button type="submit" class="nav-button active form-submit">send it!</button>
                </form>
                <p id="formStatus" class="form-status"></p>
            </div>
        </div>
    </div>
    <script src="https://forminit.com/sdk/v1/forminit.js"></script>
    <script src="script.js"></script>
</body>
</html>
